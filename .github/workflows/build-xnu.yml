name: build-sheng-kernel
on:
  workflow_dispatch:

jobs:
  kernel:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Checkout device repository
        run: git clone --depth 1 --recurse-submodules https://github.com/UniXNU/UniXNU-sheng.git ../sheng
      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          python3 --version
      - name: Install host tools
        run: brew install unifdef llvm lld
      - name: Select configuration
        run: python3 ./unixnu defconfig sheng_defconfig -D ../sheng
      - name: Fetch sources
        run: python3 ./unixnu fetch -D ../sheng
      - name: Fetch IPSW components
        run: python3 ./unixnu ipsw fetch -D ../sheng
      - name: Seed Apple header index caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 ./unixnu tree -D ../sheng
          mkdir -p out/sheng/tree/.cache/sources
          cd out/sheng/tree/.cache/sources
          base=https://api.github.com/repos/apple-oss-distributions/xnu/contents
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$base/iokit/DriverKit?ref=xnu-10063.121.3" -o xnu-driverkit-10063.121.3.json
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$base/iokit/DriverKit/crypto?ref=xnu-10063.121.3" -o xnu-driverkit-crypto-10063.121.3.json
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$base/EXTERNAL_HEADERS/TrustCache?ref=xnu-8796.101.5" -o xnu-trustcache-8796.101.5.json
          ls -l
      - name: Build kernel and prelink
        env:
          JOBS: 3
        run: python3 ./unixnu build kernel -D ../sheng -j 3
      - name: Upload kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sheng-kernel
          path: |
            out/sheng/kernel/kernel.macho
            out/sheng/kernel/kernel.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sheng-logs
          path: out/sheng/logs/*.log
          if-no-files-found: warn
          retention-days: 14
