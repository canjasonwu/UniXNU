name: build-xnu-baseline
on:
  workflow_dispatch:

jobs:
  xnu:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          python3 --version
      - name: Install host tools
        run: brew install unifdef
      - name: Build XNU 4K baseline
        env:
          JOBS: 3
        run: |
          set -o pipefail
          bash scripts/build-xnu-4k-baseline.sh 2>&1 | tee build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: xnu-baseline-arm64
          path: build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837*
          if-no-files-found: error
          retention-days: 14
