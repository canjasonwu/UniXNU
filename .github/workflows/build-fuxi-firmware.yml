# Build the fuxi (Xiaomi 13) UEFI firmware volume on a hosted Linux runner.
#
# Target location in the fork: .github/workflows/build-fuxi-firmware.yml
# Device description expected at: devices/fuxi/  (board.toml, configs/, uefi-config/)
#
# What this produces: SILICIUM_UEFI.fd, the firmware volume that bootimg needs,
# and boot.img. It does not build a kernel, a payload or a userdata image.
#
# Two patches are applied to the Mu-Silicium checkout before the build. Both are
# real defects in that tree for this board, not build workarounds:
#
#   1. MemoryMapLib describes sheng's FD window (0xA7100000, 3 MiB). This device's
#      own uefiplatLA.cfg says 0xA7000000, 4 MiB, and SEC maps memory from the
#      table, so the two have to agree.
#   2. BootShim copies the firmware volume with the MMU off and then cleans the
#      destination cache without ever invalidating it. On a warm reboot a stale
#      dirty line gets written back over the freshly copied bytes; because FVMAIN
#      is an LZMA stream, one wrong byte makes SEC report "Decompress Failed -
#      Invalid Parameter" and stop. Invalidating [FD_BASE, FD_BASE+FD_SIZE)
#      before the copy fixes it; verified on hardware 2026-10-22.
#
# Constraints baked into the steps below:
#   * fuxi.dsc pulls KailuaPkg through PACKAGES_PATH ({uefi}/Silicon/Qualcomm), so
#     the uefi checkout must include that tree, not just Platforms/Xiaomi.
#   * EDK II needs the Mu pip requirements; without them the build stops on an
#     import error that looks unrelated to the packaging.
#   * The firmware volume must be exactly 0x400000 bytes; the FDF gets FD_BASE /
#     FD_SIZE / FD_BLOCKS from the device description.

name: build fuxi firmware

on:
  workflow_dispatch:
    inputs:
      watchdog_seconds:
        description: 'reset the device after N seconds (0 = no watchdog); used for unattended test loops'
        default: '0'

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout UniXNU fork with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout uefi-fuxi (fuxi branch)
        uses: actions/checkout@v4
        with:
          repository: hanzi123-bilp/uefi-fuxi
          ref: fuxi
          path: uefi-fuxi
          submodules: recursive

      - name: Verify the trees the DSC needs
        run: |
          set -e
          test -f uefi-fuxi/Platforms/Xiaomi/fuxiPkg/fuxi.dsc
          test -f uefi-fuxi/Platforms/Xiaomi/fuxiPkg/fuxi.fdf
          test -d uefi-fuxi/Silicon/Qualcomm/KailuaPkg
          test -f uefi-fuxi/Silicon/Qualcomm/KailuaPkg/KailuaPkg.dsc.inc
          test -d uefi-fuxi/Mu_Basecore

      - name: Apply the corrected device config
        run: |
          set -e
          cp devices/fuxi/uefi-config/fuxi.toml uefi-fuxi/Resources/Configs/fuxi.toml
          grep -q '0xA7000000' uefi-fuxi/Resources/Configs/fuxi.toml
          grep -q '0x400000' uefi-fuxi/Resources/Configs/fuxi.toml

      - name: Fix the fuxi FD rows to match uefiplatLA.cfg
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path
          p = Path("uefi-fuxi/Platforms/Xiaomi/fuxiPkg/Library/MemoryMapLib/MemoryMapLib.c")
          t = p.read_text(encoding="utf-8")
          before = t
          # drop the invented 1 MiB "FD Reserved" row
          t = re.sub(r'[ \t]*\{"FD Reserved".*?\},\r?\n', '', t)
          # point the FD row at the real window: 0xA7000000, 4 MiB
          t = re.sub(r'("UEFI FD",\s*)0xA7100000,\s*0x00300000', r'\g<1>0xA7000000, 0x00400000', t)
          if t == before:
              sys.exit("MemoryMapLib patch did not change anything")
          p.write_text(t, encoding="utf-8")
          print("patched", p)
          PY
          grep -n 'UEFI FD' uefi-fuxi/Platforms/Xiaomi/fuxiPkg/Library/MemoryMapLib/MemoryMapLib.c

      - name: Fix BootShim so the destination cache is invalidated before the copy
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          p = Path("uefi-fuxi/BootShim/BootShim.S")
          t = p.read_text(encoding="utf-8")
          old = "  ldr   x6,  =FD_SIZE\n\n_CopyLoop:"
          if old not in t:
              sys.exit("copy loop anchor not found in BootShim.S")
          new = "".join([
            "  ldr   x6,  =FD_SIZE\n",
            "\n",
            "  /* Discard stale dirty lines covering the destination before copying. */\n",
            "  mrs   x9, ctr_el0\n",
            "  ubfx  x9, x9, #16, #4\n",
            "  mov   x10, #4\n",
            "  lsl   x9, x10, x9\n",
            "  sub   x10, x9, #1\n",
            "  bic   x11, x5, x10\n",
            "  add   x12, x5, x6\n",
            "_InvalLoop:\n",
            "  dc    ivac, x11\n",
            "  add   x11, x11, x9\n",
            "  cmp   x11, x12\n",
            "  b.lo  _InvalLoop\n",
            "  dsb   sy\n",
            "\n",
            "_CopyLoop:",
          ])
          p.write_text(t.replace(old, new, 1), encoding="utf-8")
          print("BootShim invalidate loop inserted")
          PY
          grep -n -A3 '_InvalLoop' uefi-fuxi/BootShim/BootShim.S

      - name: Install the test watchdog driver
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.watchdog_seconds != '' && inputs.watchdog_seconds != '0' }}
        env:
          WATCHDOG_SECONDS: ${{ inputs.watchdog_seconds }}
        run: |
          set -e
          : "${WATCHDOG_SECONDS:=0}"
          driver=uefi-fuxi/Platforms/Xiaomi/fuxiPkg/Drivers/FuxiWatchdog
          mkdir -p "$driver"
          cp devices/fuxi/watchdog/FuxiWatchdog.inf "$driver/"
          ticks=$(( WATCHDOG_SECONDS * 10000000 ))
          sed "s|^#define WD_TICKS .*|#define WD_TICKS  ${ticks}ULL|" \
            devices/fuxi/watchdog/FuxiWatchdog.c > "$driver/FuxiWatchdog.c"
          grep -n 'WD_TICKS' "$driver/FuxiWatchdog.c" | head -2
          python3 - <<'PY'
          import sys
          from pathlib import Path
          fdf = Path("uefi-fuxi/Platforms/Xiaomi/fuxiPkg/fuxi.fdf")
          t = fdf.read_text(encoding="utf-8")
          anchor = "  !include QcomPkg/Extra.fdf.inc"
          if anchor not in t:
              sys.exit("FDF anchor not found")
          if "FuxiWatchdog" not in t:
              t = t.replace(anchor, "  INF fuxiPkg/Drivers/FuxiWatchdog/FuxiWatchdog.inf\n\n" + anchor, 1)
              fdf.write_text(t, encoding="utf-8")
          print("FDF updated")
          PY
          grep -n 'FuxiWatchdog' uefi-fuxi/Platforms/Xiaomi/fuxiPkg/fuxi.fdf

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm make python3 python3-pip device-tree-compiler uuid-dev
          test -f /usr/include/uuid/uuid.h
          for v in /usr/lib/llvm-*/bin; do echo "$v" >> "$GITHUB_PATH"; done
          for t in clang lld-link llvm-lib llvm-rc llvm-objcopy llvm-nm llvm-ar; do
            if ! command -v "$t" >/dev/null 2>&1; then
              cand=$(ls /usr/lib/llvm-*/bin/"$t" 2>/dev/null | head -1 || true)
              if [ -n "$cand" ]; then sudo ln -sf "$cand" "/usr/local/bin/$t"; fi
            fi
          done
          command -v clang && command -v lld-link && command -v llvm-lib && command -v llvm-rc

      - name: Install Mu pip requirements
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r uefi-fuxi/pip-requirements.txt

      - name: defconfig
        run: python3 ./unixnu defconfig fuxi_defconfig -D devices/fuxi

      - name: fetch sources
        run: python3 ./unixnu fetch

      - name: build firmware
        run: |
          set -o pipefail
          python3 ./unixnu build firmware \
            --uefi uefi-fuxi \
            --edk2 uefi-fuxi/Mu_Basecore \
            --skip-preflight 2>&1 | tee firmware-build.log

      - name: make boot image
        run: |
          set -o pipefail
          mkdir -p out/fuxi/boot
          python3 devices/fuxi/make-bootimg.py \
            --uefi uefi-fuxi \
            --target DEBUG \
            --dtb devices/fuxi/fuxi-live.dtb \
            --output out/fuxi/boot/boot.img 2>&1 | tee bootimg.log
          ls -l out/fuxi/boot/boot.img

      - name: Check the firmware volume size
        if: always()
        run: |
          fv=$(find uefi-fuxi/Build/fuxiPkg -path '*DEBUG*/FV/SILICIUM_UEFI.fd' | head -1)
          if [ -n "$fv" ]; then
            size=$(stat -c %s "$fv")
            echo "firmware volume: $fv ($size bytes), expected 4194304"
            test "$size" -eq 4194304
          else
            echo "no firmware volume produced"
            ls -R uefi-fuxi/Build 2>/dev/null | head -40 || true
            exit 1
          fi

      - name: Upload firmware and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuxi-firmware-${{ github.run_id }}
          path: |
            uefi-fuxi/Build/fuxiPkg/**/FV/*.fd
            out/fuxi/boot/boot.img
            bootimg.log
            firmware-build.log
            out/fuxi/logs/**
          if-no-files-found: warn
