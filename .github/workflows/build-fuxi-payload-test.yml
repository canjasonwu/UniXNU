# Prove the boot-entry pipeline for fuxi: payload volume, config parsing, ADT
# generation and the DarwinBoot handoff all work, using a placeholder kernel.
#
# Why a placeholder: the real kernel needs out/<device>/tree to carry the device
# half of the platform code (drivers/, kits/, package/, patches/), which the fuxi
# device repository does not have yet. Everything downstream of the kernel --
# the FAT payload volume, EFI/UniXNU/unixnu.toml, the ADT sidecar and the loader --
# can still be exercised now, so that stage is not blocked behind the port.
#
# What this should produce: a boot image whose payload volume makes the UniXNU
# menu list one "xnu" entry instead of "no boot entry found".
#
# Target location in the fork: .github/workflows/build-fuxi-payload-test.yml

name: build fuxi payload pipeline test

on:
  workflow_dispatch:
    inputs:
      console_only:
        description: '1 = leave the UniXNU app out so the DXE console text stays visible'
        default: '0'

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout UniXNU fork with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout uefi-fuxi (fuxi branch)
        uses: actions/checkout@v4
        with:
          repository: hanzi123-bilp/uefi-fuxi
          ref: fuxi
          path: uefi-fuxi
          submodules: recursive

      - name: Apply the corrected device config
        run: |
          set -e
          cp devices/fuxi/uefi-config/fuxi.toml uefi-fuxi/Resources/Configs/fuxi.toml
          grep -q '0xA7000000' uefi-fuxi/Resources/Configs/fuxi.toml

      - name: Fix the fuxi FD rows to match uefiplatLA.cfg
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path
          p = Path("uefi-fuxi/Platforms/Xiaomi/fuxiPkg/Library/MemoryMapLib/MemoryMapLib.c")
          t = p.read_text(encoding="utf-8")
          before = t
          t = re.sub(r'[ \t]*\{"FD Reserved".*?\},\r?\n', '', t)
          t = re.sub(r'("UEFI FD",\s*)0xA7100000,\s*0x00300000', r'\g<1>0xA7000000, 0x00400000', t)
          if t == before:
              sys.exit("MemoryMapLib patch did not change anything")
          p.write_text(t, encoding="utf-8")
          print("patched MemoryMapLib")
          PY

      - name: Fix BootShim so the destination cache is invalidated before the copy
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          p = Path("uefi-fuxi/BootShim/BootShim.S")
          t = p.read_text(encoding="utf-8")
          old = "  ldr   x6,  =FD_SIZE\n\n_CopyLoop:"
          if old not in t:
              sys.exit("copy loop anchor not found in BootShim.S")
          new = "".join([
            "  ldr   x6,  =FD_SIZE\n",
            "\n",
            "  /* Discard stale dirty lines covering the destination before copying. */\n",
            "  mrs   x9, ctr_el0\n",
            "  ubfx  x9, x9, #16, #4\n",
            "  mov   x10, #4\n",
            "  lsl   x9, x10, x9\n",
            "  sub   x10, x9, #1\n",
            "  bic   x11, x5, x10\n",
            "  add   x12, x5, x6\n",
            "_InvalLoop:\n",
            "  dc    ivac, x11\n",
            "  add   x11, x11, x9\n",
            "  cmp   x11, x12\n",
            "  b.lo  _InvalLoop\n",
            "  dsb   sy\n",
            "\n",
            "_CopyLoop:",
          ])
          p.write_text(t.replace(old, new, 1), encoding="utf-8")
          print("BootShim invalidate loop inserted")
          PY

      - name: Enable the boot memory driver
        run: |
          # Without FuxiBootMemoryDxe nothing ever publishes /chosen's initrd as a
          # block device, so the payload FAT volume cannot be seen and the boot
          # manager always reports "no boot entry found". It was disabled because
          # the ranges it derives from the Android live FDT made DXE touch MMIO
          # and fault; this run turns it back on to capture its own debug output
          # (FUXIMEM: ...) on the panel.
          python3 - <<'PY'
          import re, sys
          from pathlib import Path
          dsc = Path("uefi-fuxi/Platforms/Xiaomi/fuxiPkg/fuxi.dsc")
          t = dsc.read_text(encoding="utf-8")
          before = t
          t = t.replace("  #fuxiPkg/Drivers/FuxiBootMemoryDxe/FuxiBootMemoryDxe.inf",
                        "  fuxiPkg/Drivers/FuxiBootMemoryDxe/FuxiBootMemoryDxe.inf")
          if t == before:
              sys.exit("fuxi.dsc entry not found")
          dsc.write_text(t, encoding="utf-8")
          inc = Path("uefi-fuxi/Platforms/Xiaomi/fuxiPkg/Include/DXE.inc")
          s = inc.read_text(encoding="utf-8")
          before = s
          s = s.replace("  #INF fuxiPkg/Drivers/FuxiBootMemoryDxe/FuxiBootMemoryDxe.inf",
                        "  INF fuxiPkg/Drivers/FuxiBootMemoryDxe/FuxiBootMemoryDxe.inf")
          if s == before:
              sys.exit("DXE.inc entry not found")
          inc.write_text(s, encoding="utf-8")
          print("FuxiBootMemoryDxe enabled")
          PY
          grep -n 'FuxiBootMemoryDxe' uefi-fuxi/Platforms/Xiaomi/fuxiPkg/fuxi.dsc uefi-fuxi/Platforms/Xiaomi/fuxiPkg/Include/DXE.inc

      - name: Optionally drop the UniXNU app for a console-only run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.console_only == '1' }}
        run: |
          # The boot manager draws over the whole panel, which hides every DEBUG
          # line the drivers printed before it. Leaving the application out keeps
          # the console text on screen so the FUXIMEM:/MMU/volume-scan messages
          # can be read and photographed.
          python3 - <<'PY'
          import sys
          from pathlib import Path
          fdf = Path("uefi-fuxi/Platforms/Xiaomi/fuxiPkg/fuxi.fdf")
          t = fdf.read_text(encoding="utf-8")
          before = t
          t = t.replace("  INF UniXNUPkg/Application/UniXNU/UniXNU.inf",
                        "  #INF UniXNUPkg/Application/UniXNU/UniXNU.inf")
          if t == before:
              sys.exit("UniXNU app entry not found in the FDF")
          fdf.write_text(t, encoding="utf-8")
          # BDS runs a boot attempt after a timeout and powers the board off, which
          # wipes the panel before it can be read. Hold the CPU after the driver has
          # printed and published, so the console text stays put.
          src = Path("uefi-fuxi/Platforms/Xiaomi/fuxiPkg/Drivers/FuxiBootMemoryDxe/FuxiBootMemoryDxe.c")
          s = src.read_text(encoding="utf-8")
          old = "  AddMemory ((VOID *)(UINTN)Dtb);\n  PublishInitrd ((VOID *)(UINTN)Dtb);\n  return EFI_SUCCESS;"
          if old not in s:
              sys.exit("hold anchor not found in FuxiBootMemoryDxe.c")
          new = ("  AddMemory ((VOID *)(UINTN)Dtb);\n  PublishInitrd ((VOID *)(UINTN)Dtb);\n"
                 '  DEBUG ((DEBUG_ERROR, "FUXIMEM: holding the panel for diagnostics\\n"));\n'
                 "  CpuDeadLoop ();\n  return EFI_SUCCESS;")
          src.write_text(s.replace(old, new, 1), encoding="utf-8")
          print("UniXNU app removed and the driver now holds the panel")
          PY
          grep -n 'UniXNU' uefi-fuxi/Platforms/Xiaomi/fuxiPkg/fuxi.fdf | head -5
          grep -n 'CpuDeadLoop' uefi-fuxi/Platforms/Xiaomi/fuxiPkg/Drivers/FuxiBootMemoryDxe/FuxiBootMemoryDxe.c

      - name: Make the initrd discovery scan for the FAT volume
        run: |
          # ABL reports linux,initrd-start/-end as 0xB5A9A000-0xB7FFE515 on this
          # board: 37 MiB long and not a multiple of the sector size, so the stock
          # driver rejected it and never published a block device. The payload FAT
          # image sits inside that range, so the patched driver scans it sector by
          # sector for a FAT boot sector and publishes the volume that its BPB
          # describes. Kept as a full file in devices/fuxi/driver-overrides/.
          cp devices/fuxi/driver-overrides/FuxiBootMemoryDxe.c \
             uefi-fuxi/Platforms/Xiaomi/fuxiPkg/Drivers/FuxiBootMemoryDxe/FuxiBootMemoryDxe.c
          grep -n 'no FAT volume' uefi-fuxi/Platforms/Xiaomi/fuxiPkg/Drivers/FuxiBootMemoryDxe/FuxiBootMemoryDxe.c

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm make python3 python3-pip device-tree-compiler uuid-dev mtools
          test -f /usr/include/uuid/uuid.h
          for v in /usr/lib/llvm-*/bin; do echo "$v" >> "$GITHUB_PATH"; done
          for t in clang lld-link llvm-lib llvm-rc llvm-objcopy llvm-nm llvm-ar; do
            if ! command -v "$t" >/dev/null 2>&1; then
              cand=$(ls /usr/lib/llvm-*/bin/"$t" 2>/dev/null | head -1 || true)
              if [ -n "$cand" ]; then sudo ln -sf "$cand" "/usr/local/bin/$t"; fi
            fi
          done
          command -v mformat && command -v mcopy

      - name: Install Mu pip requirements
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r uefi-fuxi/pip-requirements.txt

      - name: Shrink the payload volume for the pipeline test
        run: |
          # A placeholder kernel needs no 192 MiB volume, and a small boot image is
          # much quicker to hand to fastboot. panic_screen is off because the
          # placeholder is not an XNU Mach-O.
          python3 - <<'PY'
          import re, sys
          from pathlib import Path
          p = Path("devices/fuxi/board.toml")
          t = p.read_text(encoding="utf-8")
          t2 = re.sub(r'(?m)^size_mib = 192$', 'size_mib = 8', t)
          t2 = re.sub(r'(?m)^panic_screen = true$', 'panic_screen = false', t2)
          if t2 == t:
              sys.exit("board.toml payload test patch did not apply")
          p.write_text(t2, encoding="utf-8")
          print("payload volume: 8 MiB, panic_screen off")
          PY
          grep -n 'size_mib\|panic_screen' devices/fuxi/board.toml | head -5

      - name: defconfig
        run: python3 ./unixnu defconfig fuxi_defconfig -D devices/fuxi

      - name: fetch sources
        run: python3 ./unixnu fetch

      - name: build firmware
        run: |
          set -o pipefail
          python3 ./unixnu build firmware \
            --uefi uefi-fuxi \
            --edk2 uefi-fuxi/Mu_Basecore \
            --skip-preflight 2>&1 | tee firmware-build.log

      - name: build the payload volume with a placeholder kernel
        run: |
          set -o pipefail
          mkdir -p out/fuxi/payload-input
          # Mach-O 64 magic plus padding: enough for the payload step to stage a
          # file; the boot manager only needs a readable entry to list.
          python3 - <<'PY'
          from pathlib import Path
          stub = Path("out/fuxi/payload-input/kernel.macho")
          stub.parent.mkdir(parents=True, exist_ok=True)
          stub.write_bytes(bytes.fromhex("cffaedfe") + bytes(4096))
          print("placeholder kernel:", stub, stub.stat().st_size, "bytes")
          PY
          python3 ./unixnu build payload \
            --uefi uefi-fuxi \
            --kernel out/fuxi/payload-input/kernel.macho \
            --unique-chip-id 0x437cad96a2f 2>&1 | tee payload.log
          ls -l out/fuxi/payload/

      - name: make boot image with the payload volume
        run: |
          # unixnu bootimg verifies a v0 header layout and fuxi needs v3, so the
          # image is assembled with the device's own v3-aware script.
          set -o pipefail
          python3 devices/fuxi/make-bootimg.py \
            --uefi uefi-fuxi \
            --dtb devices/fuxi/fuxi-live.dtb \
            --ramdisk out/fuxi/payload/payload.img \
            --output out/fuxi/boot/boot-payload.img 2>&1 | tee bootimg.log
          ls -l out/fuxi/boot/

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuxi-payload-test-${{ github.run_id }}
          path: |
            uefi-fuxi/Build/fuxiPkg/**/FV/*.fd
            out/fuxi/boot/boot-payload.img
            out/fuxi/payload/payload.json
            payload.log
            bootimg.log
            firmware-build.log
            out/fuxi/logs/**
          if-no-files-found: warn
