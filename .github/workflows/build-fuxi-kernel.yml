# Build the fuxi XNU kernel, prelink it and pack it into the payload volume.
#
# This is the one stage that cannot run on Linux: the kernel step uses the Xcode
# iphoneos SDK and the prelink step uses compression_tool. GitHub's macos runners
# carry both, so no local Mac is needed.
#
# Status: first attempt. The device half of the platform code is a baseline
# copied from UniXNU-sheng (devices/fuxi/package/) and the archive builders were
# pointed at kits/fuxi; expect this to fail at the first step that is genuinely
# sheng-specific and to be iterated from there.
#
# Target location in the fork: .github/workflows/build-fuxi-kernel.yml

name: build fuxi kernel and payload

on:
  workflow_dispatch:
    inputs:
      chip_id:
        description: 'unique-chip-id seed (8 bytes hex); the ADT needs it, the value is device specific'
        default: '0x1234567890abcdef'

concurrency:
  group: fuxi-kernel
  cancel-in-progress: false

jobs:
  kernel:
    runs-on: macos-14
    timeout-minutes: 300

    steps:
      - name: Checkout UniXNU fork with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout uefi-fuxi (fuxi branch)
        uses: actions/checkout@v4
        with:
          repository: hanzi123-bilp/uefi-fuxi
          ref: fuxi
          path: uefi-fuxi
          submodules: recursive

      - name: Apply the corrected device config
        run: |
          set -e
          cp devices/fuxi/uefi-config/fuxi.toml uefi-fuxi/Resources/Configs/fuxi.toml
          grep -q '0xA7000000' uefi-fuxi/Resources/Configs/fuxi.toml

      - name: Fix the fuxi FD rows and BootShim
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path
          mm = Path("uefi-fuxi/Platforms/Xiaomi/fuxiPkg/Library/MemoryMapLib/MemoryMapLib.c")
          t = mm.read_text(encoding="utf-8")
          before = t
          t = re.sub(r'[ \t]*\{"FD Reserved".*?\},\r?\n', '', t)
          t = re.sub(r'("UEFI FD",\s*)0xA7100000,\s*0x00300000', r'\g<1>0xA7000000, 0x00400000', t)

          # DarwinBoot asks the memory map for one contiguous conventional run the size
          # of the ADT window and AllocatePages(AllocateAddress) inside it. The vendor
          # table reserves exactly that run for the kernel at 0xA8000000, so the loader
          # can never see it. Publish it as conventional memory instead.
          t, window = re.subn(r'(\{"Kernel",\s*0xA8000000,\s*0x10000000,[^}]*?)\bReserv\b', r'\1Conv', t)
          if window == 0 and not re.search(r'\{"Kernel",\s*0xA8000000,\s*0x10000000,[^}]*?Conv\b', t):
              sys.exit("Kernel window row not found in MemoryMapLib")
          if t == before:
              sys.exit("MemoryMapLib patch did not change anything")
          mm.write_text(t, encoding="utf-8")
          shim = Path("uefi-fuxi/BootShim/BootShim.S")
          s = shim.read_text(encoding="utf-8")
          old = "  ldr   x6,  =FD_SIZE\n\n_CopyLoop:"
          if old not in s:
              sys.exit("BootShim anchor not found")
          new = "".join([
            "  ldr   x6,  =FD_SIZE\n", "\n",
            "  /* Discard stale dirty lines covering the destination before copying. */\n",
            "  mrs   x9, ctr_el0\n", "  ubfx  x9, x9, #16, #4\n",
            "  mov   x10, #4\n", "  lsl   x9, x10, x9\n", "  sub   x10, x9, #1\n",
            "  bic   x11, x5, x10\n", "  add   x12, x5, x6\n",
            "_InvalLoop:\n", "  dc    ivac, x11\n", "  add   x11, x11, x9\n",
            "  cmp   x11, x12\n", "  b.lo  _InvalLoop\n", "  dsb   sy\n", "\n",
            "_CopyLoop:",
          ])
          shim.write_text(s.replace(old, new, 1), encoding="utf-8")
          print("patched MemoryMapLib and BootShim")
          PY

      - name: Enable the boot memory driver
        # The kernel pipeline builds the firmware straight from the uefi-fuxi branch,
        # which publishes no payload volume, so the boot manager reports "no boot
        # entry" while the payload sits in the boot image. Turn FuxiBootMemoryDxe on
        # exactly the way the payload test workflow does; the next step replaces its
        # source with the version that can actually find the volume in the initrd.
        run: |
          python3 - <<'PYEOF'
          import re, sys
          from pathlib import Path

          dxe = Path("uefi-fuxi/Platforms/Xiaomi/fuxiPkg/Include/DXE.inc")
          t = dxe.read_text(encoding="utf-8")
          pat = re.compile(r'(?m)^[ \t]*#[ \t]*INF[ \t]+fuxiPkg/Drivers/FuxiBootMemoryDxe/FuxiBootMemoryDxe\.inf[ \t]*$')
          t2, n = pat.subn("  INF fuxiPkg/Drivers/FuxiBootMemoryDxe/FuxiBootMemoryDxe.inf", t)
          if n == 0 and "  INF fuxiPkg/Drivers/FuxiBootMemoryDxe/FuxiBootMemoryDxe.inf" not in t2:
              sys.exit("DXE.inc: FuxiBootMemoryDxe line not found")
          dxe.write_text(t2, encoding="utf-8")

          dsc = Path("uefi-fuxi/Platforms/Xiaomi/fuxiPkg/fuxi.dsc")
          t = dsc.read_text(encoding="utf-8")
          pat = re.compile(r'(?m)^[ \t]*#[ \t]*fuxiPkg/Drivers/FuxiBootMemoryDxe/FuxiBootMemoryDxe\.inf[ \t]*$')
          t2, n = pat.subn("  fuxiPkg/Drivers/FuxiBootMemoryDxe/FuxiBootMemoryDxe.inf", t)
          if n == 0 and "  fuxiPkg/Drivers/FuxiBootMemoryDxe/FuxiBootMemoryDxe.inf" not in t2:
              sys.exit("fuxi.dsc: FuxiBootMemoryDxe line not found")
          dsc.write_text(t2, encoding="utf-8")
          print("FuxiBootMemoryDxe enabled")
          PYEOF
          grep -n 'FuxiBootMemoryDxe' uefi-fuxi/Platforms/Xiaomi/fuxiPkg/Include/DXE.inc uefi-fuxi/Platforms/Xiaomi/fuxiPkg/fuxi.dsc | grep -v '^.*:#' || true

      - name: Make the initrd discovery scan for the FAT volume
        # ABL reports the initrd range as 37 MiB and not sector aligned, so the stock
        # driver rejects it and no block device ever appears. The override scans that
        # range sector by sector for a FAT boot sector and publishes the volume its
        # BPB describes. Kept as a full file in devices/fuxi/driver-overrides/.
        run: |
          cp devices/fuxi/driver-overrides/FuxiBootMemoryDxe.c \
             uefi-fuxi/Platforms/Xiaomi/fuxiPkg/Drivers/FuxiBootMemoryDxe/FuxiBootMemoryDxe.c
          grep -n 'no FAT volume' uefi-fuxi/Platforms/Xiaomi/fuxiPkg/Drivers/FuxiBootMemoryDxe/FuxiBootMemoryDxe.c

      - name: Install the test watchdog driver
        # A finished or failed run leaves the phone on the UEFI panel, where there is
        # no USB function and nothing on the host can reach it; every experiment would
        # then need someone to hold the power button. The watchdog resets through PSCI
        # after a fixed delay, so the phone returns to Android by itself and the host
        # can start the next image unattended.
        run: |
          set -e
          WATCHDOG_SECONDS=90
          driver=uefi-fuxi/Platforms/Xiaomi/fuxiPkg/Drivers/FuxiWatchdog
          mkdir -p "$driver"
          cp devices/fuxi/watchdog/FuxiWatchdog.inf "$driver/"
          ticks=$(( WATCHDOG_SECONDS * 10000000 ))
          sed "s|^#define WD_TICKS .*|#define WD_TICKS  ${ticks}ULL|" \
            devices/fuxi/watchdog/FuxiWatchdog.c > "$driver/FuxiWatchdog.c"
          grep -n 'WD_TICKS' "$driver/FuxiWatchdog.c" | head -2
          python3 - <<'PYEOF'
          import sys
          from pathlib import Path
          dxe = Path("uefi-fuxi/Platforms/Xiaomi/fuxiPkg/Include/DXE.inc")
          t = dxe.read_text(encoding="utf-8")
          # The FDF pulls DXE.inc in before QcomPkg/Extra.fdf.inc, and DarwinBoot sits
          # in that list and blocks in its menu, so a driver appended to the FDF tail
          # would never be dispatched. Place the watchdog next to TimerDxe instead: it
          # needs the timer protocol, and it has to be armed before anything can block.
          anchor = "  INF ArmPkg/Drivers/TimerDxe/TimerDxe.inf"
          if "FuxiWatchdog" not in t:
              if anchor not in t:
                  sys.exit("DXE.inc TimerDxe anchor not found")
              t = t.replace(anchor, anchor + "\n  INF fuxiPkg/Drivers/FuxiWatchdog/FuxiWatchdog.inf", 1)
              dxe.write_text(t, encoding="utf-8")

          dsc = Path("uefi-fuxi/Platforms/Xiaomi/fuxiPkg/fuxi.dsc")
          t = dsc.read_text(encoding="utf-8")
          key = "fuxiPkg/Drivers/FuxiKeyInputDxe/FuxiKeyInputDxe.inf"
          if "FuxiWatchdog" not in t:
              if key not in t:
                  sys.exit("fuxi.dsc anchor not found")
              t = t.replace(key, key + "\n  fuxiPkg/Drivers/FuxiWatchdog/FuxiWatchdog.inf", 1)
              dsc.write_text(t, encoding="utf-8")
          print("DXE.inc and DSC updated")
          PYEOF
          grep -n 'FuxiWatchdog' uefi-fuxi/Platforms/Xiaomi/fuxiPkg/Include/DXE.inc uefi-fuxi/Platforms/Xiaomi/fuxiPkg/fuxi.dsc

      - name: Widen the loader window floor
        # DarwinBoot refuses any window below 256 MiB, but the loader aligns the base
        # to 2 MiB and then adds Kernel.Base & (2 MiB - 1), so a window equal to the
        # free run loses 0x4000 bytes and gets skipped. Lower the floor to 224 MiB and
        # let board.toml ask for 254 MiB.
        run: |
          python3 - <<'PYEOF'
          import sys
          from pathlib import Path
          h = Path("drivers/DarwinBoot/DarwinBootPkg/Driver/WindowSize.h")
          if not h.is_file():
              sys.exit("WindowSize.h not found")
          t = h.read_text(encoding="utf-8")
          before = t
          t = t.replace("size >= 0x10000000ULL", "size >= 0x0e000000ULL")
          if t == before and "0x0e000000ULL" not in t:
              sys.exit("window floor not found")
          h.write_text(t, encoding="utf-8")
          print("window floor lowered")
          PYEOF
          grep -n '0x0e000000' drivers/DarwinBoot/DarwinBootPkg/Driver/WindowSize.h

      - name: Select Xcode 16.2
        # The default Xcode on this image is 15.4; xnu-10063 is a macOS 15 source
        # and its mig needs the newer toolchain, otherwise UNDReplyServer.c fails
        # with 'unknown argument: -mach_msg2'.
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          xcodebuild -version

      - name: Install host tools
        run: |
          set -e
          brew install mtools llvm lld unifdef cmake ninja dtc
          # keg-only formulae are not symlinked; the checks below run in this step,
          # so export the paths here as well as for the following steps.
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/opt/lld/bin:/opt/homebrew/opt/unifdef/bin:$PATH"
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/lld/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/unifdef/bin" >> "$GITHUB_PATH"
          command -v xcodebuild
          xcodebuild -version
          command -v mformat
          command -v llvm-nm
          command -v clang

      - name: Install Mu pip requirements
        run: |
          # Homebrew's python is externally managed (PEP 668), so the build runs
          # inside a venv that is put first on PATH for the following steps.
          python3 -m venv "$GITHUB_WORKSPACE/.venv"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pip install --upgrade pip
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pip install -r uefi-fuxi/pip-requirements.txt

      - name: defconfig
        run: python3 ./unixnu defconfig fuxi_defconfig -D devices/fuxi

      - name: fetch sources
        run: python3 ./unixnu fetch

      - name: build kernel
        env:
          # prepare-xnu-source.py reads the GitHub contents API; without a token the
          # shared runner IP hits the anonymous rate limit and the step fails with 403.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          # Two passes over the same tree. The first one compiles XNU and stops at
          # the link because the board archives do not exist yet; it exists to leave
          # the compile records the archive builders read. The second pass finds
          # them, builds the archives and links the kernel. Everything stays in the
          # job workspace, so no cache is involved.
          echo '=== pass 1: compile records ==='
          python3 ./unixnu build kernel 2>&1 | tee kernel-build-pass1.log || true
          cp out/fuxi/logs/kernel-bootstrap.log out/fuxi/logs/kernel-bootstrap-pass1.log || true
          echo '=== pass 2: archives and link ==='
          python3 ./unixnu build kernel 2>&1 | tee kernel-build.log

      - name: build payload volume
        run: |
          set -o pipefail
          python3 ./unixnu build payload \
            --uefi uefi-fuxi \
            --unique-chip-id "${{ inputs.chip_id }}" 2>&1 | tee payload.log

      - name: build firmware
        run: |
          set -o pipefail
          python3 ./unixnu build firmware \
            --uefi uefi-fuxi \
            --edk2 uefi-fuxi/Mu_Basecore \
            --skip-preflight 2>&1 | tee firmware-build.log

      - name: make boot image
        run: |
          set -o pipefail
          # v3 headers carry no dtb field, so ABL keeps its own tree and the
          # initrd properties still describe the previous Android boot. v2 plus
          # --dtb makes ABL fill in the addresses of the ramdisk it loaded.
          python3 devices/fuxi/make-bootimg.py \
            --uefi uefi-fuxi \
            --dtb devices/fuxi/fuxi-live.dtb \
            --ramdisk out/fuxi/payload/payload.img \
            --header-version 2 \
            --dtb-field \
            --output out/fuxi/boot/boot.img 2>&1 | tee bootimg.log
          ls -l out/fuxi/boot/

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuxi-kernel-${{ github.run_id }}
          path: |
            out/fuxi/kernel/kernel.macho
            out/fuxi/kernel/*.json
            out/fuxi/payload/payload.img
            out/fuxi/payload/payload.json
            out/fuxi/boot/boot.img
            kernel-build.log
            kernel-build-pass1.log
            prebuild.log
            payload.log
            firmware-build.log
            bootimg.log
            out/fuxi/logs/**
          if-no-files-found: warn
